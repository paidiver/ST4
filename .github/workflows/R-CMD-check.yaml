# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs in rocker/r-ver containers, which have R already installed. This skips
# setup-r, whose system package install was the slowest part of each run.
#
# Ubuntu only during development. PRs: R release only. main + manual: release,
# oldrel and devel. Add macOS and Windows back once dev is done (#37); they
# cannot use containers and need setup-r.
on:
  push:
    branches: [main, master]
    paths: &paths
      - "R/**"
      - "tests/**"
      - "man/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    container: rocker/r-ver:${{ matrix.r }}

    name: ubuntu (${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        r: ${{ fromJSON(github.event_name == 'pull_request' && '["4.6"]' || '["4.6", "4.5", "devel"]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
