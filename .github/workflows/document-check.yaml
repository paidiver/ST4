# Fails if man/ or NAMESPACE are out of date with the roxygen comments.
# Fix locally with devtools::document() and commit the result.
on:
  push:
    branches: [main, master]
    paths: &paths
      - "R/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/document-check.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

name: document-check.yaml

permissions: read-all

jobs:
  document-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Rebuild docs
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Fail if docs changed
        run: git diff --exit-code -- man NAMESPACE
