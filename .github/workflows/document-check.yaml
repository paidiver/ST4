# Fails if man/ or NAMESPACE are out of date with the roxygen comments.
# Fix locally with devtools::document() and commit the result.
#
# Runs in a rocker/r-ver container, which has R already installed. The
# container has no git, so the docs are compared with a saved copy instead of
# git diff.
on:
  push:
    branches: [main, master]
    paths: &paths
      - "R/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/document-check.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

name: document-check.yaml

permissions: read-all

jobs:
  document-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Save the committed docs
        run: |
          mkdir -p /tmp/committed
          cp -r man NAMESPACE /tmp/committed/

      - name: Rebuild docs
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Fail if docs changed
        run: |
          diff -r /tmp/committed/man man
          diff /tmp/committed/NAMESPACE NAMESPACE
